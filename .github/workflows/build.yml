name: Build and Commit Dylib

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ runner.temp }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos & SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com
          unzip -q master.zip
          mv sdks-master/*.sdk $THEOS/sdks/

      - name: Compile Dylib
        run: |
          make package
          mkdir -p build
          cp .theos/obj/debug/AdBlocker.dylib build/
          cp packages/*.deb build/

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Compiled Dylib
          files: |
            build/AdBlocker.dylib
            build/*.deb
