name: Build and Commit Dylib

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ runner.temp }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos & SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone theos/theos $THEOS -- --recursive
          gh repo clone theos/sdks ${{ runner.temp }}/sdks -- --depth 1
          mv ${{ runner.temp }}/sdks/*.sdk $THEOS/sdks/

      - name: Compile Dylib
        run: |
          make package
          mkdir -p build
          cp .theos/obj/debug/AdBlocker.dylib build/
          cp packages/*.deb build/

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Compiled Dylib
          files: |
            build/AdBlocker.dylib
            build/*.deb
